# Arquivo responsável por instruir o Java a como se comunicar com o MySQL
# VARIÁVEIS DE AMBIENTE, CREDENCIAISM PORTAS E COMPORTAMENTOS DOS FRAMEWORKS:

# nome da aplicação
spring.application.name=dentalCare

# conexão com o banco (credenciais vêm de variáveis de ambiente)
# Endereço que roda o MySQL:
spring.datasource.url=jdbc:mysql://localhost:3306/dentalCare 
# crendenciais não expostas: (indica a buscar no SO nas variáveis de ambiente e não em texto puro)
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# o Hibernate VALIDA as tabelas na base de dados se correspondem às entidades Java; quem o cria é o Flyway (não utilizar o UPDATE e nem CREATE)
spring.jpa.hibernate.ddl-auto=validate

# evita consultas lazy disparadas fora da camada de serviço
spring.jpa.open-in-view=false

# mostra o SQL gerado no console (apenas em desenvolvimento)
spring.jpa.show-sql=true